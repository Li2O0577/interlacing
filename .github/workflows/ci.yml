name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: |
          uv venv .venv --python ${{ matrix.python }}
          uv pip install --python .venv/bin/python -e . pytest mcp      # mcp: the reference client, for one test
          .venv/bin/python -m pytest -q tests
      - name: Unused names, undefined names, and types
        run: |
          uv pip install --python .venv/bin/python pyflakes mypy
          .venv/bin/python -m pyflakes src tests scripts examples
          .venv/bin/python -m mypy src/interlacing
      - name: Build
        run: uv build -o dist
      - name: Installed wheel alone in a clean environment
        run: |
          uv venv .clean-env --python ${{ matrix.python }}
          uv pip install --python .clean-env/bin/python dist/*.whl
          cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/.clean-env/bin/python" "$GITHUB_WORKSPACE/scripts/package_smoke.py" "$GITHUB_WORKSPACE/examples/graphs"

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INTERLACING_TEST_POSTGRES: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[postgres]' pytest
      - run: python -m pytest -q tests/test_postgres_collab.py
      - name: Rehearse the HTTP demo, online backup and recovery
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: test
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/pg_restore ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client-16
          fi
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          pg_dump --version
          pg_restore --version
          python scripts/rehearse_deployment.py

  other-systems:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          python -m pip install -e . pytest
          python -m pytest -q tests
